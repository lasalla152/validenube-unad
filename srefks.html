<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Panel SC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.2);
            width: 300px;
        }
        h2 {
            margin-bottom: 20px;
        }
        input {
            display: block;
            margin: 10px auto;
            padding: 12px;
            width: 90%;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #333;
            color: white;
            box-sizing: border-box;
        }
        button {
            padding: 12px;
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            font-weight: bold;
        }
        button:hover {
            background: #218838;
        }
        .error {
            color: #ff4c4c;
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🔐 Panel SC</h2>
        <p id="errorMessage" class="error">Usuario o contraseña incorrectos.</p>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword } from './firebase-config.js';

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            const fakeEmail = username + '@panel.com';
            
            signInWithEmailAndPassword(auth, fakeEmail, password)
                .then((userCredential) => {
                    sessionStorage.setItem('admin_logged_in', 'true');
                    window.location.href = 'asrec.html';
                })
                .catch((error) => {
                    const errorMessage = document.getElementById('errorMessage');
                    errorMessage.style.display = 'block';
                    errorMessage.innerText = "Credenciales incorrectas.";
                });
        });
    </script>
</body>
</html>
